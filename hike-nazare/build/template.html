<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caminho da Nazaré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* Field-guide route card: a stage strip drawn to scale up top, then the
     itinerary beside a sticky topo map (the itinerary is the map key), then
     the elevation profile full width. Cool limestone ground, waymark blue. */
  :root {
    --ground: #edf0ee;
    --paper: #f8faf9;
    --ink: #14232f;
    --muted: #59676d;
    --rule: #cdd5d2;
    --accent: #1c5fa6;
    --day1: #1f6fb3;   /* Atlantic */
    --day2: #b3701a;   /* Serra de Aire limestone ochre */
    --day3: #4b7b38;
    --day4: #7c4892;
    --display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f171c; --paper: #16212a; --ink: #e2e8e5; --muted: #95a3a8;
      --rule: #2b3a44; --accent: #6ea9ea;
      --day1: #4f9be0; --day2: #d99a47; --day3: #7fb266; --day4: #b684cc;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0f171c; --paper: #16212a; --ink: #e2e8e5; --muted: #95a3a8;
    --rule: #2b3a44; --accent: #6ea9ea;
    --day1: #4f9be0; --day2: #d99a47; --day3: #7fb266; --day4: #b684cc;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 0 20px;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-variation-settings: 'wdth' 100;
    font-size: 16px;
    line-height: 1.5;
  }
  .page { max-width: 1120px; margin: 0 auto; padding-block: 40px 32px; }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .num { font-family: var(--data); font-variant-numeric: tabular-nums; }

  /* ---- header ---- */
  .eyebrow {
    margin: 0 0 6px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-stretch: 68%;
    font-variation-settings: 'wdth' 68;
    font-size: clamp(2.8rem, 8vw, 5.4rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .lede { margin: 14px 0 0; max-width: 34em; font-size: 1.12rem; color: var(--muted); }

  /* stage strip: each day's width is its share of the distance */
  .stages { margin: 34px 0 0; }
  .stage-bar { display: flex; gap: 3px; height: 10px; }
  .stage-bar span { border-radius: 2px; min-width: 0; }
  .stage-stops { position: relative; height: 3.4em; margin-top: 8px; }
  .stop {
    position: absolute; top: 0;
    display: flex; flex-direction: column;
    white-space: nowrap;
    transform: translateX(-50%); text-align: center;
  }
  .stop:first-child { transform: none; text-align: left; }
  .stop:last-child { transform: translateX(-100%); text-align: right; }
  .stop b { font-weight: 700; font-size: 0.98rem; }
  .stop .num { font-size: 0.78rem; color: var(--muted); }

  .stats {
    display: flex; flex-wrap: wrap; gap: 10px 36px;
    margin: 22px 0 0; padding: 16px 0 0;
    border-top: 1px solid var(--rule);
  }
  .stats div { display: flex; flex-direction: column; }
  .stats dt {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .stats dd { margin: 2px 0 0; font-family: var(--data); font-size: 1.3rem; font-weight: 500; }

  /* ---- sections ---- */
  h2 {
    display: flex; align-items: center; gap: 12px;
    margin: 0 0 14px;
    font-size: 0.78rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink);
  }
  h2::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

  .plan {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 36px;
    margin-top: 48px;
  }
  @media (min-width: 900px) {
    .plan { grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 44px; align-items: start; }
    .route-col { position: sticky; top: 20px; }
    #map { height: min(640px, calc(100vh - 110px)); }
  }

  #map {
    width: 100%;
    height: 440px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--paper);
    z-index: 0;
  }
  .map-note { margin: 8px 0 0; font-size: 0.8rem; color: var(--muted); }

  /* ---- itinerary: one spine, markers echoing the map symbols ---- */
  #timeline { position: relative; }
  #timeline::before {
    content: '';
    position: absolute;
    left: 6px; top: 10px; bottom: 10px;
    width: 1px;
    background: var(--rule);
  }
  .tl-group + .tl-group { margin-top: 10px; }
  .tl-phase {
    position: relative;
    margin: 0 0 12px;
    padding-left: 30px;
    font-family: var(--display);
    font-variation-settings: 'wdth' 75;
    font-stretch: 75%;
    font-size: 1.35rem; font-weight: 800;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .tl-group:first-child .tl-phase { color: var(--muted); }
  .tl-items { list-style: none; margin: 0; padding: 0; }
  .tl-item { position: relative; padding: 0 0 20px 30px; }
  .tl-item:last-child { padding-bottom: 12px; }
  .tl-item p { margin: 1px 0; }

  .tl-mark {
    position: absolute;
    left: 0; top: 6px;
    width: 13px; height: 13px;
  }
  .tl-mark--stay { border-radius: 50%; box-shadow: 0 0 0 3px var(--ground); }
  .tl-mark--travel {
    background: var(--ground);
    border: 2px solid var(--ink);
    border-radius: 2px;
  }
  .tl-mark--walk {
    left: -1px; width: 15px;
    height: 5px; top: 10px;
    border-radius: 3px;
    box-shadow: 0 0 0 3px var(--ground);
  }

  .tl-title { font-weight: 700; font-size: 1.05rem; line-height: 1.35; }
  .tl-title .mode {
    display: inline-block;
    margin-right: 6px;
    font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
    vertical-align: 2px;
  }
  .tl-title .arrow { color: var(--muted); font-weight: 400; padding: 0 2px; }
  .tl-title a { text-decoration: none; }
  .tl-title a:hover { text-decoration: underline; }
  .tl-meta { font-family: var(--data); font-size: 0.84rem; font-variant-numeric: tabular-nums; }
  .tl-meta .dur { color: var(--muted); }
  .tl-item--stay .tl-meta { font-family: var(--body); font-size: 0.92rem; }
  .tl-sub { color: var(--muted); font-size: 0.86rem; margin-top: 3px !important; }
  .tl-sub a { text-decoration: none; }
  .tl-sub a:hover { text-decoration: underline; }

  /* ---- elevation ---- */
  .elevation { margin-top: 56px; }
  .profile-head {
    display: flex; flex-wrap: wrap;
    justify-content: space-between; align-items: baseline;
    gap: 4px 16px;
    font-size: 0.86rem; color: var(--muted);
  }
  #readout { font-family: var(--data); font-variant-numeric: tabular-nums; color: var(--ink); }
  #readout.idle { color: var(--muted); }
  #profile {
    display: block;
    width: 100%;
    height: 220px;
    margin-top: 8px;
    touch-action: none;
    cursor: crosshair;
    overflow: visible;
  }
  #profile .area { fill-opacity: 0.18; }
  #profile .line { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
  #profile .axis { stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke; }
  #profile .split {
    stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3;
    opacity: 0.45; vector-effect: non-scaling-stroke;
  }
  #profile .gridlabel { fill: var(--muted); font-size: 11px; font-family: var(--data); }
  #profile .daylabel { font-size: 11px; font-weight: 700; font-family: var(--body); letter-spacing: 0.08em; }
  #profile .cursor { stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: 0; }
  #profile .cursor.on { opacity: 0.6; }
  .hint { font-size: 0.8rem; color: var(--muted); margin: 4px 0 0; }

  footer {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
    margin-top: 44px; padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-size: 0.86rem; color: var(--muted);
  }
  .gpx {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--accent); color: var(--paper);
    font-weight: 600; text-decoration: none;
  }
  .gpx:hover { filter: brightness(1.08); }

  /* map furniture */
  .terminal-pin span {
    display: block;
    width: 12px; height: 12px;
    background: #fff;
    border: 2px solid #14232f;
    border-radius: 2px;
  }
  .leaflet-tooltip.stay-tip {
    font-family: var(--body);
    font-size: 12px;
    font-weight: 700;
    color: #14232f;
    text-align: center;
  }
  .leaflet-tooltip.stay-tip .tip-sub { font-weight: 400; color: #59676d; }
  .leaflet-container { font-family: var(--body); }

  @media (max-width: 600px) {
    body { padding: 0 16px; font-size: 15px; }
    .page { padding-block: 28px 24px; }
    .stats { gap: 10px 24px; }
    .stats dd { font-size: 1.1rem; }
    #map { height: 360px; }
    #profile { height: 170px; }
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <p class="eyebrow">A two-day walk</p>
    <h1>Caminho da Nazaré</h1>
    <p class="lede">On foot from the Atlantic at Nazaré, over the limestone hills past Porto de Mós, to the sanctuary at Fátima.</p>

    <div class="stages" aria-label="Stages drawn to scale">
      <div class="stage-bar" id="stagebar"></div>
      <div class="stage-stops" id="stagestops"></div>
    </div>

    <dl class="stats" id="stats"></dl>
  </header>

  <div class="plan">
    <section class="itinerary-col">
      <h2>Itinerary</h2>
      <div id="timeline"></div>
    </section>

    <section class="route-col">
      <h2>Route</h2>
      <div id="map"></div>
    </section>
  </div>

  <section class="elevation">
    <h2>Elevation</h2>
    <div class="profile-head">
      <span>Nazaré to Fátima</span>
      <span id="readout" class="idle">Move along the profile</span>
    </div>
    <svg id="profile" preserveAspectRatio="none" aria-label="Elevation profile of the route"></svg>
    <p class="hint">The point under your cursor or finger is marked on the map.</p>
  </section>

  <footer>
    <a id="gpxlink" class="gpx" href="#">Download the GPX</a>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Route points as [lat, lon, ele]. Extracted from the source GPX's three <rte>
   elements (the app's default 3-day staging); Day 2 and Day 3 are stored in
   reverse walking order there, so they were reversed before being concatenated
   into this single ordered path from Nazare to Fatima. */
const PTS = /*__DATA__*/;

/* The walk is split into days at the overnight stops, not at the GPX's own
   stage boundaries. Both come from accomadation.txt via the generator. */
const SPLITS = /*__SPLITS__*/;   // route indices where a walking day ends
const STAYS = /*__STAYS__*/;     // from accomadation.txt, earliest first
const TRAVEL = /*__TRAVEL__*/;   // from transportation.txt, in trip order
const GPX_FILE = /*__GPXNAME__*/;

document.getElementById('gpxlink').href = 'gpx/' + encodeURIComponent(GPX_FILE);

/* ---- geometry ---- */
function haversine(a, b) {
  const R = 6371000;
  const p1 = a[0] * Math.PI / 180, p2 = b[0] * Math.PI / 180;
  const dp = p2 - p1, dl = (b[1] - a[1]) * Math.PI / 180;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

const cum = new Float64Array(PTS.length);
for (let i = 1; i < PTS.length; i++) cum[i] = cum[i - 1] + haversine(PTS[i - 1], PTS[i]);
const total = cum[cum.length - 1];

function climb(i0, i1) {
  let up = 0, down = 0;
  for (let i = i0 + 1; i <= i1; i++) {
    const d = PTS[i][2] - PTS[i - 1][2];
    if (d > 0) up += d; else down -= d;
  }
  return { up, down };
}

/* day colours come from the CSS tokens, so the theme owns them */
const css = getComputedStyle(document.documentElement);
const token = name => css.getPropertyValue(name).trim();
const PALETTE = ['--day1', '--day2', '--day3', '--day4'].map(token);
const INK = token('--ink') || '#14232f';
const MUTED = token('--muted') || '#59676d';

/* start, then each overnight's town, then the finish */
const PLACES = ['Nazaré', ...STAYS.filter(s => s.role === 'overnight').map(s => s.town), 'Fátima'];

const edges = [0, ...SPLITS, PTS.length - 1];
const DAYS = [];
for (let i = 0; i < edges.length - 1; i++) {
  const from = edges[i], to = edges[i + 1];
  DAYS.push({
    name: `Day ${i + 1}`,
    where: `${PLACES[i]} → ${PLACES[i + 1]}`,
    from, to,
    color: PALETTE[i % PALETTE.length],
    dist: cum[to] - cum[from],
    ...climb(from, to),
  });
}

const eles = PTS.map(p => p[2]);
const eMin = Math.min(...eles), eMax = Math.max(...eles);
const totClimb = DAYS.reduce((s, d) => s + d.up, 0);
const totDrop = DAYS.reduce((s, d) => s + d.down, 0);
const km = m => (m / 1000).toFixed(1);

/* ---- totals ---- */
document.getElementById('stats').innerHTML = [
  ['Total', km(total) + ' km'],
  ['Climb', '+' + Math.round(totClimb) + ' m'],
  ['Descent', '\u2212' + Math.round(totDrop) + ' m'],
  ['Highest', Math.round(eMax) + ' m'],
  ['Days', DAYS.length],
].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');

/* ---- stage strip: bars and stops placed by distance ---- */
document.getElementById('stagebar').innerHTML = DAYS.map(d =>
  `<span style="flex:${d.dist.toFixed(0)};background:${d.color}" title="${d.name}"></span>`).join('');
document.getElementById('stagestops').innerHTML = edges.map((idx, i) =>
  `<span class="stop" style="left:${(cum[idx] / total * 100).toFixed(2)}%">
    <b>${PLACES[i]}</b><span class="num">${km(cum[idx])} km · ${Math.round(PTS[idx][2])} m</span></span>`).join('');

/* ---- itinerary ----
   The data carries no dates, so chronology is derived from the shape of the
   trip: (phase, slot). phase 0 is the day before setting off and phase N the
   Nth walking day; within a phase the slots run inbound travel, the walk,
   outbound travel, then the night. Clock times only break ties. */
const FIRST_PLACE = PLACES[0];
const LAST_PLACE = PLACES[PLACES.length - 1];

/* colour of the night at the end of walking day n, and of that day's line */
const nightColor = n => n === 0 ? 'var(--muted)' : `var(--day${n})`;

function buildTimeline() {
  const items = [];

  TRAVEL.forEach((t, i) => {
    let phase, slot;
    if (t.to === FIRST_PLACE) {            // arriving at the start
      phase = 0; slot = 1;
    } else if (t.from === LAST_PLACE) {     // leaving from the finish
      phase = DAYS.length; slot = 3;
    } else {                                // fall back to file order
      const inbound = i === 0;
      phase = inbound ? 0 : DAYS.length;
      slot = inbound ? 1 : 3;
    }
    items.push({ kind: 'travel', phase, slot, t });
  });

  DAYS.forEach((d, i) => items.push({ kind: 'walk', phase: i + 1, slot: 2, d }));

  let n = 0;
  STAYS.forEach(s => {
    const night = s.role === 'start' ? 0 : ++n;
    items.push({ kind: 'stay', phase: night, slot: 4, s, night });
  });

  return items.sort((a, b) => a.phase - b.phase || a.slot - b.slot
    || ((a.t && a.t.depart) || '').localeCompare((b.t && b.t.depart) || ''));
}

const phaseLabel = p => p === 0 ? 'Day before' : `Day ${p}`;

function renderRow(it) {
  if (it.kind === 'travel') {
    const t = it.t;
    const far = t.near ? ''
      : ` <span class="far">· ${Math.round(t.off / 1000)} km off the map</span>`;
    return `<li class="tl-item">
      <span class="tl-mark tl-mark--travel"></span>
      <div class="tl-body">
        <p class="tl-title"><span class="mode">${t.mode}</span>
          ${t.from} <span class="arrow">→</span> ${t.to}</p>
        <p class="tl-meta">${t.depart} → ${t.arrive}
          <span class="dur">(${t.duration})</span></p>
        <p class="tl-sub">Departs <a href="${t.url}" rel="noreferrer">${t.terminal}</a>${far}</p>
      </div></li>`;
  }
  if (it.kind === 'walk') {
    const d = it.d;
    return `<li class="tl-item">
      <span class="tl-mark tl-mark--walk" style="background:${d.color}"></span>
      <div class="tl-body">
        <p class="tl-title"><span class="mode">Walk</span>
          ${d.where.replace('→', '<span class="arrow">→</span>')}</p>
        <p class="tl-meta">${km(d.dist)} km · +${Math.round(d.up)} m
          / \u2212${Math.round(d.down)} m</p>
      </div></li>`;
  }
  const s = it.s;
  const sub = it.night === 0
    ? 'The night before setting off'
    : `End of Day ${it.night} · ${km(cum[SPLITS[it.night - 1]])} km in · `
      + `${km(total - cum[SPLITS[it.night - 1]])} km still to walk`;
  return `<li class="tl-item tl-item--stay">
    <span class="tl-mark tl-mark--stay" style="background:${nightColor(it.night)}"></span>
    <div class="tl-body">
      <p class="tl-title"><a href="${s.url}" rel="noreferrer">${s.name}</a></p>
      <p class="tl-meta">${s.addr}</p>
      <p class="tl-sub">${sub}</p>
    </div></li>`;
}

const groups = [];
for (const it of buildTimeline()) {
  if (!groups.length || groups[groups.length - 1].phase !== it.phase) {
    groups.push({ phase: it.phase, items: [] });
  }
  groups[groups.length - 1].items.push(it);
}

document.getElementById('timeline').innerHTML = groups.map(g => `
  <section class="tl-group">
    <h4 class="tl-phase">${phaseLabel(g.phase)}</h4>
    <ol class="tl-items">${g.items.map(renderRow).join('')}</ol>
  </section>`).join('');

/* ---- map ---- */
const map = L.map('map', { scrollWheelZoom: false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const all = [];
for (const d of DAYS) {
  // include the split point in both slices so the two lines meet with no gap
  const seg = PTS.slice(d.from, d.to + 1).map(p => [p[0], p[1]]);
  d.layer = L.polyline(seg, { color: d.color, weight: 4, opacity: 0.9 }).addTo(map);
  all.push(...seg);
}
for (const st of STAYS) all.push([st.lat, st.lon]);
for (const t of TRAVEL) if (t.near) all.push([t.lat, t.lon]);   // far ones would blow up the view
const bounds = L.latLngBounds(all);
map.fitBounds(bounds, { padding: [20, 20] });

let seen = 0;
for (const st of STAYS) {
  const isStart = st.role === 'start';
  if (!isStart) seen++;
  L.circleMarker([st.lat, st.lon], {
    radius: 7, color: '#fff', weight: 2,
    fillColor: isStart ? MUTED : DAYS[Math.min(seen, DAYS.length) - 1].color,
    fillOpacity: 1
  }).addTo(map).bindTooltip(
    `${st.name}<br><span class="tip-sub">${st.town}</span>`,
    { direction: 'top', className: 'stay-tip' }
  );
}

/* bus terminals: hollow squares, so they don't read as overnight stops */
for (const t of TRAVEL) {
  L.marker([t.lat, t.lon], {
    icon: L.divIcon({
      className: 'terminal-pin',
      html: '<span></span>',
      iconSize: [12, 12],
      iconAnchor: [6, 6],
    })
  }).addTo(map).bindTooltip(
    `${t.terminal}<br><span class="tip-sub">${t.mode} · ${t.from} → ${t.to}</span>`,
    { direction: 'top', className: 'stay-tip' }
  );
}

const dot = L.circleMarker([PTS[0][0], PTS[0][1]], {
  radius: 6, color: '#fff', weight: 2, fillColor: INK, fillOpacity: 1
});

/* ---- elevation profile ---- */
const svg = document.getElementById('profile');
const NS = 'http://www.w3.org/2000/svg';
const VW = 1000, VH = 200;
const PAD = { t: 16, r: 2, b: 18, l: 34 };
svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);

const plotW = VW - PAD.l - PAD.r;
const plotH = VH - PAD.t - PAD.b;
const yLo = Math.floor(eMin / 50) * 50;
const yHi = Math.ceil(eMax / 50) * 50;
const floorY = PAD.t + plotH;

const sx = m => PAD.l + (m / total) * plotW;
const sy = e => PAD.t + plotH - ((e - yLo) / (yHi - yLo)) * plotH;

function el(name, attrs, text) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

/* gridlines behind everything */
for (const e of [yLo, (yLo + yHi) / 2, yHi]) {
  svg.appendChild(el('line', { class: 'axis', x1: PAD.l, y1: sy(e), x2: VW - PAD.r, y2: sy(e) }));
  svg.appendChild(el('text', { class: 'gridlabel', x: PAD.l - 6, y: sy(e) + 4, 'text-anchor': 'end' }, e + ''));
}

/* one path per day, sampled at ~1 viewBox unit */
for (const d of DAYS) {
  const x0 = sx(cum[d.from]), x1 = sx(cum[d.to]);
  const n = Math.max(2, Math.round(x1 - x0));
  const pts = [];
  for (let s = 0; s <= n; s++) {
    const target = cum[d.from] + (s / n) * d.dist;
    let lo = d.from, hi = d.to;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < target) lo = mid + 1; else hi = mid; }
    pts.push([sx(cum[lo]), sy(PTS[lo][2])]);
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
  const area = line + `L${x1.toFixed(1)} ${floorY.toFixed(1)}L${x0.toFixed(1)} ${floorY.toFixed(1)}Z`;
  svg.appendChild(el('path', { class: 'area', d: area, fill: d.color }));
  svg.appendChild(el('path', { class: 'line', d: line, stroke: d.color }));
  svg.appendChild(el('text', {
    class: 'daylabel', x: (x0 + x1) / 2, y: 10, 'text-anchor': 'middle', fill: d.color
  }, d.name));
}

/* a dashed line at each overnight */
for (const i of SPLITS) {
  svg.appendChild(el('line', { class: 'split', x1: sx(cum[i]), y1: PAD.t, x2: sx(cum[i]), y2: floorY }));
}

/* x labels at the start, each overnight, and the finish */
for (const m of [0, ...SPLITS.map(i => cum[i]), total]) {
  svg.appendChild(el('text', {
    class: 'gridlabel', x: sx(m), y: VH - 4,
    'text-anchor': m === 0 ? 'start' : (m === total ? 'end' : 'middle')
  }, km(m) + ' km'));
}

const cursor = svg.appendChild(el('line', { class: 'cursor', y1: PAD.t, y2: floorY }));

/* ---- hover interaction ---- */
const readout = document.getElementById('readout');

function atClientX(clientX) {
  const r = svg.getBoundingClientRect();
  const frac = (clientX - r.left) / r.width;
  const m = ((frac * VW) - PAD.l) / plotW * total;
  return Math.max(0, Math.min(total, m));
}

function show(clientX) {
  const m = atClientX(clientX);
  let lo = 0, hi = PTS.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < m) lo = mid + 1; else hi = mid; }
  const p = PTS[lo];
  cursor.setAttribute('x1', sx(cum[lo]));
  cursor.setAttribute('x2', sx(cum[lo]));
  cursor.classList.add('on');
  dot.setLatLng([p[0], p[1]]).addTo(map);
  readout.classList.remove('idle');
  const day = DAYS.find(d => lo <= d.to) || DAYS[DAYS.length - 1];
  readout.textContent = `${day.name} · ${km(cum[lo])} km · ${Math.round(p[2])} m`;
}

function clear() {
  cursor.classList.remove('on');
  dot.remove();
  readout.classList.add('idle');
  readout.textContent = 'Move along the profile';
}

svg.addEventListener('pointermove', e => { e.preventDefault(); show(e.clientX); });
svg.addEventListener('pointerdown', e => { e.preventDefault(); show(e.clientX); });
svg.addEventListener('pointerleave', clear);
</script>
</body>
</html>
